[project]
name = "cfc-dagster-utils"
version = "1.2.2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["geopandas>=1", "pandas>=2", "sqlalchemy>=2"]

[project.optional-dependencies]
dagster = ["dagster>=1"]
earthengine = ["dagster>=1", "earthengine-api>=1"]
xarray = ["dagster>=1", "xarray>=2026.4.0"]
dvc = ["dagster>=1.12", "dvc>=3", "pyyaml>=6"]
postgres = [
    "dagster>=1.13",
    "geoalchemy2>=0.18",
    "psycopg[binary]>=3.2",
    "sqlparse>=0.5",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel<7",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "ty>=0.0.68",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "CPY001"]
per-file-ignores = { "tests/**/*.py" = ["S101"] }

[tool.semantic_release]
build_command = """
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""
commit_message = "chore(release): {version} [skip ci]"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.master]
match = "master"
prerelease = false
