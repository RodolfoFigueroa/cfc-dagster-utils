[project]
name = "cfc-dagster-utils"
version = "0.2.1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["geopandas>=1", "pandas>=2", "sqlalchemy>=2"]

[project.optional-dependencies]
dagster = ["dagster>=1"]
earthengine = ["earthengine-api>=1"]
xarray = ["xarray>=2026.4.0"]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ipykernel<7", "mypy>=1.19.1", "pre-commit>=4.5.1"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812"]
